<body class="dark">
  <div id="root"></div>
  <script type="text/babel">

const STORAGE_KEY = "ptcg-cp-cache";

function loadCachedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.events)) return null;
    const valid = parsed.events.every(e =>
      typeof e.id === "number" &&
      (e.type === "reg" || e.type === "ic") &&
      (e.status === "played" || e.status === "upcoming")
    );
    if (!valid) return null;
    return parsed;
  } catch { return null; }
}

const REG_PLACEMENTS = [
  { label: "2nd",   cp: 325 }, { label: "T4",    cp: 300 },
  { label: "T8",    cp: 280 }, { label: "T16",   cp: 200 },
  { label: "T32",   cp: 160 }, { label: "T64",   cp: 120 },
  { label: "T128",  cp: 80  }, { label: "T256",  cp: 60  },
  { label: "T512",  cp: 40  }, { label: "T1024", cp: 20  },
];

const IC_PLACEMENTS = [
  { label: "T8",    cp: 380 }, { label: "T16",   cp: 300 },
  { label: "T32",   cp: 240 }, { label: "T64",   cp: 180 },
  { label: "T128",  cp: 140 }, { label: "T256",  cp: 100 },
  { label: "T512",  cp: 80  }, { label: "T1024", cp: 40  },
];

const CHALLENGE_PLACEMENTS = [
  { label: "1st",   cp: 15 }, { label: "2nd", cp: 12 },
  { label: "T4",    cp: 10 }, { label: "T8",  cp: 8  },
  { label: "T16",   cp: 6  }, { label: "T32", cp: 4  },
  { label: "No CP", cp: 0  },
];

const CUP_PLACEMENTS = [
  { label: "1st",   cp: 50 }, { label: "2nd", cp: 40 },
  { label: "T4",    cp: 32 }, { label: "T8",  cp: 25 },
  { label: "T16",   cp: 20 }, { label: "T32", cp: 16 },
  { label: "T64",   cp: 13 }, { label: "No CP", cp: 0 },
];

const TOP_N          = 5;
const CHALLENGE_BFL  = 4;
const CUP_BFL        = 4;
const MAX_DISPLAY    = 800;
const THRESHOLDS     = [200, 700, 725, 740, 775, 800];
const MIN_CP_OPTIONS = [200, 580, 620, 660, 700, 720, 725, 740, 760, 775, 780, 800];

const SUBTITLES = [
  "Enhanced!", "Legal in Finland!", "Jeepers!",
  "Presented by Ryan R, the worst player who could qualify for worlds.",
  "Smelly edition.", "Bending the spoon..", "sponsored by little Timmy",
  "Getting to Worlds is kind of hard, huh.", "Now with new car smell!",
];

const THRESH_COLORS = {
  200: "var(--thresh-200)", 700: "var(--thresh-700)",
  725: "var(--thresh-725)", 740: "var(--thresh-740)",
  775: "var(--thresh-775)", 800: "var(--thresh-800)",
};

function getThresholdColor(total) {
  if (total >= 800) return "var(--thresh-800)";
  if (total >= 775) return "var(--thresh-775)";
  if (total >= 740) return "var(--thresh-740)";
  if (total >= 725) return "var(--thresh-725)";
  if (total >= 700) return "var(--thresh-700)";
  if (total >= 200) return "var(--thresh-200)";
  return null;
}
function getThresholdBg(total) {
  if (total >= 800) return "rgba(74,222,128,0.08)";
  if (total >= 775) return "rgba(134,239,172,0.07)";
  if (total >= 740) return "rgba(250,204,21,0.08)";
  if (total >= 725) return "rgba(251,191,36,0.07)";
  if (total >= 700) return "rgba(251,146,60,0.07)";
  if (total >= 200) return "rgba(100,116,139,0.05)";
  return null;
}

function multisetCombos(vals, k) {
  if (k === 0) return [[]];
  const res = [];
  function gen(start, cur) {
    if (cur.length === k) { res.push([...cur]); return; }
    for (let i = start; i < vals.length; i++) {
      cur.push(vals[i]); gen(i, cur); cur.pop();
    }
  }
  gen(0, []);
  return res;
}

const getPlacements = (type) => type === "ic" ? IC_PLACEMENTS : REG_PLACEMENTS;
const getCP         = (type, label) => getPlacements(type).find(p => p.label === label)?.cp ?? 0;
const cpToLabel     = (type, cp)    => getPlacements(type).find(p => p.cp === cp)?.label ?? "?";

const DEFAULT_EVENTS = [
  { id: 0, type: "reg", status: "played",   placement: "T64"   },
  { id: 1, type: "reg", status: "played",   placement: "T1024" },
  { id: 2, type: "reg", status: "played",   placement: "T256"  },
  { id: 3, type: "reg", status: "upcoming", placement: null    },
  { id: 4, type: "reg", status: "upcoming", placement: null    },
  { id: 5, type: "ic",  status: "upcoming", placement: null    },
];
const DEFAULT_CHALLENGES = [15, 15, 15, 15];
const DEFAULT_CUPS       = [50, 50, 50, 50];

function SlotRow({ idx, placements, slots, setter }) {
  const setSlot = (cp) => setter(s => s.map((v, i) => i === idx ? cp : v));
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 4 }}>
      <span style={{ fontSize: 10, color: "var(--btn-number-color)", fontFamily: "'IBM Plex Mono', monospace", minWidth: 12, textAlign: "right" }}>{idx + 1}</span>
      <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>
        {placements.map(p => {
          const active = slots[idx] === p.cp;
          return (
            <button key={p.label} onClick={() => setSlot(p.cp)} style={{
              background: active ? "rgba(99,102,241,0.22)" : "var(--btn-inactive-bg)",
              border:     `1px solid ${active ? "#6366f1" : "var(--btn-inactive-border)"}`,
              borderRadius: 5, padding: "2px 7px", cursor: "pointer",
              color: active ? "var(--btn-active-color)" : "var(--btn-inactive-color)",
              fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
              display: "inline-flex", flexDirection: "column", alignItems: "center",
              outline: "none", boxShadow: active ? "0 0 0 2px rgba(99,102,241,0.18)" : "none",
              transition: "all 0.11s"
            }}>
              <span style={{ fontWeight: active ? 700 : 400, lineHeight: 1.2 }}>{p.label}</span>
              <span style={{ fontSize: 8, color: active ? "var(--btn-cp-active)" : "var(--btn-cp-inactive)", lineHeight: 1.1 }}>{p.cp}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function LocalsEditor({ challengeSlots, setChallengeSlots, cupSlots, setCupSlots, localCP }) {
  const [open, setOpen] = React.useState(false);
  const challengeTotal  = challengeSlots.reduce((a, b) => a + b, 0);
  const cupTotal        = cupSlots.reduce((a, b) => a + b, 0);

  return (
    <div style={{ marginBottom: 12, background: "var(--card-bg)", border: "1px solid var(--card-border)", borderRadius: 9, overflow: "hidden" }}>
      <button onClick={() => setOpen(o => !o)} style={{
        width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
        background: "none", border: "none", padding: "10px 14px", cursor: "pointer",
        color: "var(--text-primary)", outline: "none"
      }}>
        <span style={{ fontSize: 12, fontWeight: 500 }}>Edit Challenges / Cups CP</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 11, color: "var(--sub-total-color)", fontFamily: "'IBM Plex Mono', monospace" }}>
            Challenges <strong style={{ color: "var(--text-primary)" }}>{challengeTotal}</strong>
            {" + "}Cups <strong style={{ color: "var(--text-primary)" }}>{cupTotal}</strong>
            {" = "}<strong style={{ color: "var(--text-primary)" }}>{localCP} CP</strong>
          </span>
          <span style={{ fontSize: 12, color: "var(--text-muted)", display: "inline-block", transform: open ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>&#9662;</span>
        </div>
      </button>

      {open && (
        <div style={{ padding: "0 14px 14px", borderTop: "1px solid var(--card-border)" }}>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", paddingTop: 12 }}>
            <div style={{ flex: "1 1 240px", minWidth: 240 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text-primary)" }}>
                  Challenges <span style={{ fontSize: 10, fontWeight: 400, color: "var(--text-muted)" }}>(BFL {CHALLENGE_BFL})</span>
                </span>
                <span style={{ fontSize: 11, fontFamily: "'IBM Plex Mono', monospace", color: "var(--sub-total-color)" }}>{challengeTotal} / {CHALLENGE_BFL * 15} CP</span>
              </div>
              {challengeSlots.map((_, idx) => (
                <SlotRow key={idx} idx={idx} placements={CHALLENGE_PLACEMENTS} slots={challengeSlots} setter={setChallengeSlots} />
              ))}
            </div>
            <div style={{ flex: "1 1 320px", minWidth: 300 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text-primary)" }}>
                  Cups <span style={{ fontSize: 10, fontWeight: 400, color: "var(--text-muted)" }}>(BFL {CUP_BFL})</span>
                </span>
                <span style={{ fontSize: 11, fontFamily: "'IBM Plex Mono', monospace", color: "var(--sub-total-color)" }}>{cupTotal} / {CUP_BFL * 50} CP</span>
              </div>
              {cupSlots.map((_, idx) => (
                <SlotRow key={idx} idx={idx} placements={CUP_PLACEMENTS} slots={cupSlots} setter={setCupSlots} />
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Chip({ label, cp, variant }) {
  const cfg = {
    "played-reg":  { bg:"var(--chip-played-bg)", border:"var(--chip-played-border)", color:"var(--chip-played-color)", cpColor:"var(--chip-played-cp)" },
    "played-ic":   { bg:"var(--chip-played-bg)", border:"var(--chip-played-border)", color:"var(--chip-played-color)", cpColor:"var(--chip-played-cp)" },
    "upcoming-reg":{ bg:"var(--chip-reg-bg)",    border:"var(--chip-reg-border)",    color:"var(--chip-reg-color)",    cpColor:"var(--chip-reg-cp)"    },
    "upcoming-ic": { bg:"var(--chip-ic-bg)",     border:"var(--chip-ic-border)",     color:"var(--chip-ic-color)",     cpColor:"var(--chip-ic-cp)"     },
  };
  const s = cfg[variant] || cfg["upcoming-reg"];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 3,
      background: s.bg, border: `1px solid ${s.border}`,
      borderRadius: 5, padding: "2px 7px",
      fontFamily: "'IBM Plex Mono', monospace", color: s.color, whiteSpace: "nowrap", fontSize: 11
    }}>
      {label} <span style={{ color: s.cpColor, fontSize: 9, fontWeight: 600 }}>({cp})</span>
    </span>
  );
}

function DashChip() {
  return (
    <span style={{
      display: "inline-flex", alignItems: "center",
      background: "var(--chip-dash-bg)", border: "1px solid var(--chip-dash-border)",
      borderRadius: 5, padding: "2px 8px",
      fontFamily: "'IBM Plex Mono', monospace",
      color: "var(--chip-dash-color)", fontSize: 11, fontStyle: "italic"
    }}>&#8212;</span>
  );
}

function App() {
  const cached = React.useMemo(() => loadCachedState(), []);

  const [dark, setDark] = React.useState(cached?.dark ?? true);
  React.useEffect(() => { document.body.className = dark ? "dark" : "light"; }, [dark]);

  const controlsRef = React.useRef(null);
  React.useEffect(() => {
    function measure() {
      if (controlsRef.current) {
        document.documentElement.style.setProperty('--controls-bar-height', controlsRef.current.offsetHeight + 'px');
      }
    }
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);

  const [subtitle] = React.useState(() => SUBTITLES[Math.floor(Math.random() * SUBTITLES.length)]);

  const [events,         setEvents]         = React.useState(cached?.events ?? DEFAULT_EVENTS);
  const [minTotal,       setMinTotal]       = React.useState(cached?.minTotal ?? 740);
  const [sortDir,        setSortDir]        = React.useState(cached?.sortDir ?? "asc");
  const [regCapCp,       setRegCapCp]       = React.useState(cached?.regCapCp ?? null);
  const [icCapCp,        setIcCapCp]        = React.useState(cached?.icCapCp ?? null);
  const [copyStatus,     setCopyStatus]     = React.useState("");
  const [challengeSlots, setChallengeSlots] = React.useState(cached?.challengeSlots ?? DEFAULT_CHALLENGES);
  const [cupSlots,       setCupSlots]       = React.useState(cached?.cupSlots ?? DEFAULT_CUPS);

  React.useEffect(() => {
    const state = { events, challengeSlots, cupSlots, dark, minTotal, sortDir, regCapCp, icCapCp };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  });

  const resetState = () => {
    localStorage.removeItem(STORAGE_KEY);
    window.location.reload();
  };

  const localCP = React.useMemo(() =>
    challengeSlots.reduce((a,b)=>a+b,0) + cupSlots.reduce((a,b)=>a+b,0),
    [challengeSlots, cupSlots]
  );

  const toggleType      = (id) => setEvents(evs => evs.map(e => e.id===id ? {...e,type:e.type==="reg"?"ic":"reg",placement:null} : e));
  const toggleStatus    = (id) => setEvents(evs => evs.map(e => e.id===id ? {...e,status:e.status==="played"?"upcoming":"played",placement:null} : e));
  const togglePlacement = (id, label) => setEvents(evs => evs.map(e => e.id===id ? {...e,placement:e.placement===label?null:label} : e));
  const addEvent        = () => { if (events.length < 12) setEvents(evs => { const maxId = evs.length > 0 ? Math.max(...evs.map(e => e.id)) : -1; return [...evs, {id:maxId+1,type:"reg",status:"upcoming",placement:null}]; }); };
  const removeEvent     = (id) => { if (events.length > 1) setEvents(evs => evs.filter(e => e.id!==id)); };

  const playedRegEvents   = React.useMemo(() => events.filter(e=>e.status==="played"  &&e.type==="reg"), [events]);
  const playedICEvents    = React.useMemo(() => events.filter(e=>e.status==="played"  &&e.type==="ic"),  [events]);
  const upcomingRegEvents = React.useMemo(() => events.filter(e=>e.status==="upcoming"&&e.type==="reg"), [events]);
  const upcomingICEvents  = React.useMemo(() => events.filter(e=>e.status==="upcoming"&&e.type==="ic"),  [events]);

  const nUpcomingReg = upcomingRegEvents.length;
  const nUpcomingIC  = upcomingICEvents.length;
  const nUpcoming    = nUpcomingReg + nUpcomingIC;

  const allSelectedCPs = React.useMemo(() =>
    events.filter(e=>e.placement).map(e=>getCP(e.type,e.placement)).sort((a,b)=>b-a),
    [events]
  );
  const top5Sum    = allSelectedCPs.slice(0,TOP_N).reduce((a,b)=>a+b,0);
  const totalCP    = top5Sum + localCP;
  const allSelected = events.every(e=>e.placement);
  const nUnselected = events.filter(e=>!e.placement).length;
  const topColor   = getThresholdColor(totalCP);
  const topBg      = getThresholdBg(totalCP);

  const playedRegData = React.useMemo(() =>
    playedRegEvents.filter(e=>e.placement).map(e=>({label:e.placement,cp:getCP("reg",e.placement)})).sort((a,b)=>b.cp-a.cp),
    [playedRegEvents]
  );
  const playedICData = React.useMemo(() =>
    playedICEvents.filter(e=>e.placement).map(e=>({label:e.placement,cp:getCP("ic",e.placement)})).sort((a,b)=>b.cp-a.cp),
    [playedICEvents]
  );

  const allowedRegCPs = React.useMemo(() =>
    regCapCp!==null ? [0,...REG_PLACEMENTS.filter(p=>p.cp<=regCapCp).map(p=>p.cp)] : [0,...REG_PLACEMENTS.map(p=>p.cp)],
    [regCapCp]
  );
  const allowedICCPs = React.useMemo(() =>
    icCapCp!==null ? [0,...IC_PLACEMENTS.filter(p=>p.cp<=icCapCp).map(p=>p.cp)] : [0,...IC_PLACEMENTS.map(p=>p.cp)],
    [icCapCp]
  );

  const { combos, totalCount } = React.useMemo(() => {
    const pCPs      = [...playedRegData.map(p=>p.cp), ...playedICData.map(p=>p.cp)];
    const regCombos = multisetCombos(allowedRegCPs, nUpcomingReg);
    const icCombos  = multisetCombos(allowedICCPs,  nUpcomingIC);
    const seen      = new Set();
    const results   = [];

    for (const regC of regCombos) {
      for (const icC of icCombos) {
        const allC = [...pCPs, ...regC, ...icC].sort((a,b)=>b-a);
        const mSum = allC.slice(0,TOP_N).reduce((a,b)=>a+b,0);
        const t    = mSum + localCP;
        if (t < minTotal) continue;

        const top5vals  = allC.slice(0,TOP_N);
        const availPool = [...top5vals];
        for (const pc of pCPs) { const i=availPool.indexOf(pc); if(i!==-1) availPool.splice(i,1); }

        const upAll = [
          ...regC.map((cp,j)=>({cp,src:'reg',j})),
          ...icC.map((cp,j) =>({cp,src:'ic', j})),
        ].sort((a,b)=>b.cp-a.cp);

        const pool = [...availPool];
        upAll.forEach(u => {
          if (u.cp > 0) { const i=pool.indexOf(u.cp); if(i!==-1){ pool.splice(i,1); u.contributes=true; return; } }
          u.contributes = false;
        });

        const contribParts = upAll.filter(u=>u.contributes).map(u=>`${u.src}:${u.cp}`).sort();
        const key = pCPs.slice().sort((a,b)=>b-a).join(',') + '||' + contribParts.join('|');
        if (seen.has(key)) continue;
        seen.add(key);

        const regDisp = regC.map((cp,j) => ({ cp, show: !!(upAll.find(u=>u.src==='reg'&&u.j===j)?.contributes) }));
        const icDisp  = icC.map( (cp,j) => ({ cp, show: !!(upAll.find(u=>u.src==='ic' &&u.j===j)?.contributes) }));

        results.push({ regC: regDisp, icC: icDisp, mSum, total: t });
      }
    }

    results.sort((a,b) => sortDir==="desc" ? b.total-a.total : a.total-b.total);
    return { combos: results.slice(0,MAX_DISPLAY), totalCount: results.length };
  }, [playedRegData, playedICData, nUpcomingReg, nUpcomingIC, allowedRegCPs, allowedICCPs, minTotal, sortDir, localCP]);

  const buildTableData = React.useCallback(() => {
    const headers = [
      ...playedRegData.map((_,i)=>`Played Reg ${i+1}`),
      ...playedICData.map((_,i) =>`Played IC ${i+1}`),
      ...Array.from({length:nUpcomingReg},(_,i)=>`Upcoming Reg ${i+1}`),
      ...Array.from({length:nUpcomingIC}, (_,i)=>`Upcoming IC ${i+1}`),
      `Top-${TOP_N} Sum`, "Total CP",
    ];
    const rows = combos.map(row => [
      ...playedRegData.map(p=>`${p.label}(${p.cp})`),
      ...playedICData.map(p =>`${p.label}(${p.cp})`),
      ...row.regC.map(({cp,show})=>show?`${cpToLabel("reg",cp)}(${cp})`:"\u2014"),
      ...row.icC.map( ({cp,show})=>show?`${cpToLabel("ic", cp)}(${cp})`:"\u2014"),
      row.mSum, row.total,
    ]);
    return [headers, ...rows];
  }, [combos, playedRegData, playedICData, nUpcomingReg, nUpcomingIC]);

  const downloadCSV = React.useCallback(() => {
    const data = buildTableData();
    const csv  = data.map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
    const blob = new Blob([csv],{type:"text/csv"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a"); a.href=url; a.download="cp-combinations.csv"; a.click();
    URL.revokeObjectURL(url);
  }, [buildTableData]);

  const copyToClipboard = React.useCallback(async () => {
    const text = buildTableData().map(r=>r.join("\t")).join("\n");
    try { await navigator.clipboard.writeText(text); setCopyStatus("\u2713 Copied"); }
    catch { setCopyStatus("Failed"); }
    setTimeout(()=>setCopyStatus(""),2200);
  }, [buildTableData]);

  const nUpcomingUnset = events.filter(e=>e.status==="upcoming"&&!e.placement).length;

  const selStyle = {
    background:"var(--sel-bg)", border:"1px solid var(--sel-border)",
    borderRadius:6, padding:"5px 9px", color:"var(--sel-color)", fontSize:11, cursor:"pointer", outline:"none"
  };
  const th = {
    padding:"8px 12px", textAlign:"left", fontSize:10, color:"var(--text-muted)",
    fontWeight:500, textTransform:"uppercase", letterSpacing:"0.07em", whiteSpace:"nowrap"
  };
  const td = { padding:"6px 12px", verticalAlign:"middle" };

  return (
    <div style={{ minHeight:"100vh", background:"var(--page-bg)", fontFamily:"'IBM Plex Sans', sans-serif", color:"var(--text-primary)", padding:"24px 18px", maxWidth:1080, margin:"0 auto" }}>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:16, gap:12 }}>
        <div>
          <h1 style={{ margin:"0 0 3px", fontSize:20, fontWeight:600, color:"var(--text-primary)", letterSpacing:"-0.02em" }}>
            2026 Pokemon TCG CP Calculator
          </h1>
          <p style={{ margin:"0 0 5px", fontSize:11, fontStyle:"italic", color:"var(--text-muted)" }}>{subtitle}</p>
          <p style={{ margin:0, fontSize:11, color:"var(--text-muted)", lineHeight:1.9 }}>
            Top {TOP_N} major finishes count (BFL) +{localCP} CP for Challenges/Cups {" "}
            Click <span className="hint-badge hint-badge-reg">Regional</span> or <span className="hint-badge hint-badge-ic">IC</span> to swap {" "}
            Click <span className="hint-badge hint-badge-played">Played</span> or <span className="hint-badge hint-badge-upcoming">Upcoming</span> to toggle
          </p>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
          <button onClick={resetState} title="Reset to defaults"
            style={{ background:"var(--toggle-bg)", border:"1px solid var(--toggle-border)", borderRadius:8, padding:"9px 14px", cursor:"pointer", color:"var(--text-sub)", fontSize:14, outline:"none", lineHeight:1 }}>
            Reset
          </button>
          <button onClick={()=>setDark(d=>!d)} title={dark?"Switch to light mode":"Switch to dark mode"}
            style={{ background:"var(--toggle-bg)", border:"1px solid var(--toggle-border)", borderRadius:8, padding:"9px 16px", cursor:"pointer", color:"var(--text-sub)", fontSize:20, outline:"none", lineHeight:1 }}>
            {dark?"\u2600\uFE0F":"\uD83C\uDF19"}
          </button>
          <div className="tooltip-wrap">
            <div style={{ width:38, height:38, borderRadius:"50%", background:"var(--toggle-bg)", border:"1px solid var(--toggle-border)", display:"flex", alignItems:"center", justifyContent:"center", cursor:"default", color:"var(--text-muted)", fontSize:17, fontWeight:700, userSelect:"none" }}>i</div>
            <div className="tooltip-box">
              <strong style={{ color:"var(--text-primary)", display:"block", marginBottom:6 }}>How to use</strong>
              Add events using <em>+ Add Event Slot</em>. Toggle between <strong>Regional</strong> and <strong>IC</strong> (your majors), and <strong>Played</strong> / <strong>Upcoming</strong>. For played events, click a finish to lock it in.<br /><br />
              The <strong>Remaining Combinations</strong> table enumerates every finish at your upcoming majors. A dash means that slot does not affect your total (0 pts or outside top-{TOP_N}). Use the <em>Excl.</em> dropdowns to hide unrealistic deep runs.<br /><br />
              Use <strong>Edit Challenges / Cups CP</strong> to set your locals total.<br /><br />
              Your selections are saved automatically. Use <strong>Reset</strong> to restore defaults.
            </div>
          </div>
        </div>
      </div>

      <LocalsEditor
        challengeSlots={challengeSlots} setChallengeSlots={setChallengeSlots}
        cupSlots={cupSlots} setCupSlots={setCupSlots} localCP={localCP}
      />

      <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:16 }}>
        {events.map((ev, idx) => {
          const placements = getPlacements(ev.type);
          const isPlayed   = ev.status === "played";
          return (
            <div key={ev.id} style={{ background:"var(--card-bg)", border:`1px solid ${isPlayed?"var(--card-border-played)":"var(--card-border-upcoming)"}`, borderRadius:9, padding:"8px 13px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:7 }}>
                <span style={{ fontSize:11, color:"var(--btn-number-color)", fontFamily:"'IBM Plex Mono', monospace", minWidth:16 }}>{idx+1}</span>
                <button onClick={()=>toggleType(ev.id)} title="Swap Regional / IC"
                  style={{ background:ev.type==="ic"?"var(--badge-ic-bg)":"var(--badge-reg-bg)", border:`1px solid ${ev.type==="ic"?"var(--badge-ic-border)":"var(--badge-reg-border)"}`, color:ev.type==="ic"?"var(--badge-ic-color)":"var(--badge-reg-color)", borderRadius:5, padding:"2px 8px", fontSize:10, cursor:"pointer", fontWeight:600, letterSpacing:"0.04em", outline:"none" }}>
                  {ev.type==="ic"?"\u26A1 IC":"\uD83C\uDFC6 Regional"}
                </button>
                <button onClick={()=>toggleStatus(ev.id)}
                  style={{ background:isPlayed?"var(--badge-played-bg)":"var(--badge-upcoming-bg)", border:`1px solid ${isPlayed?"var(--badge-played-border)":"var(--badge-upcoming-border)"}`, color:isPlayed?"var(--badge-played-color)":"var(--badge-upcoming-color)", borderRadius:5, padding:"2px 8px", fontSize:10, cursor:"pointer", fontWeight:600, letterSpacing:"0.04em", outline:"none" }}>
                  {isPlayed?"Played":"Upcoming"}
                </button>
                {events.length > 1 && (
                  <button onClick={()=>removeEvent(ev.id)} style={{ marginLeft:"auto", background:"none", border:"none", color:"var(--text-dim)", cursor:"pointer", fontSize:14, padding:"0 2px", outline:"none" }} title="Remove event">&times;</button>
                )}
              </div>
              <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                {placements.map(p => {
                  const active = ev.placement === p.label;
                  return (
                    <button key={p.label} onClick={()=>togglePlacement(ev.id,p.label)}
                      style={{ background:active?"rgba(99,102,241,0.22)":"var(--btn-inactive-bg)", border:`1px solid ${active?"#6366f1":"var(--btn-inactive-border)"}`, borderRadius:6, padding:"3px 9px", cursor:"pointer", color:active?"var(--btn-active-color)":"var(--btn-inactive-color)", fontFamily:"'IBM Plex Mono', monospace", fontSize:11, display:"inline-flex", flexDirection:"column", alignItems:"center", outline:"none", boxShadow:active?"0 0 0 2px rgba(99,102,241,0.18)":"none", transition:"all 0.11s" }}>
                      <span style={{ fontWeight:active?700:400, lineHeight:1.3 }}>{p.label}</span>
                      <span style={{ fontSize:9, color:active?"var(--btn-cp-active)":"var(--btn-cp-inactive)", lineHeight:1.2 }}>{p.cp}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
        {events.length < 12 && (
          <button onClick={addEvent} style={{ background:"var(--add-btn-bg)", border:"1px dashed var(--add-btn-border)", borderRadius:9, padding:"7px", color:"var(--add-btn-color)", cursor:"pointer", fontSize:12, outline:"none", letterSpacing:"0.04em" }}>
            + Add Event Slot
          </button>
        )}
      </div>

      <div style={{ background:topBg||"rgba(255,255,255,0.02)", border:`1px solid ${topColor?topColor+"40":"var(--card-border)"}`, borderRadius:11, padding:"14px 18px", marginBottom:20 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
          <div>
            <div style={{ fontSize:10, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:4 }}>
              Total Championship Points{!allSelected?" \u2014 partial":""}
            </div>
            <div style={{ display:"flex", alignItems:"baseline", gap:8 }}>
              <span style={{ fontSize:38, fontWeight:600, fontFamily:"'IBM Plex Mono', monospace", color:topColor||"var(--text-primary)", letterSpacing:"-0.03em", lineHeight:1 }}>
                {totalCP}
              </span>
              <span style={{ fontSize:11, color:"var(--sub-total-color)" }}>{top5Sum} majors + {localCP} locals</span>
            </div>
            {!allSelected && (
              <div style={{ fontSize:10, color:"#b45309", marginTop:5 }}>
                {"\u26A0 "} {nUnselected} event{nUnselected!==1?"s":""} still {nUnselected===1?"needs":"need"} a placement selected
              </div>
            )}
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:3 }}>
            {THRESHOLDS.map(t => {
              const col = THRESH_COLORS[t];
              const hit = totalCP >= t;
              return (
                <div key={t} style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, opacity:hit?1:0.35 }}>
                  <div style={{ width:6, height:6, borderRadius:"50%", background:hit?col:"var(--text-dim)" }} />
                  <span style={{ color:hit?col:"var(--text-muted)", fontFamily:"'IBM Plex Mono', monospace" }}>
                    {t} {hit?"\u2713":"(need "+(t-totalCP)+" more)"}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <div className="controls-bar" ref={controlsRef}>
        <div style={{ display:"flex", alignItems:"flex-end", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
          <div>
            <div style={{ fontSize:13, fontWeight:600, color:"var(--text-primary)", marginBottom:1 }}>Remaining Combinations</div>
            <div style={{ fontSize:11, color:"var(--text-muted)" }}>
              {nUpcomingReg} upcoming reg {"\u00B7"} {nUpcomingIC} upcoming IC {"\u00B7"}{" "}
              {totalCount>MAX_DISPLAY ? "showing top "+MAX_DISPLAY+" of "+totalCount.toLocaleString() : totalCount+" unique combination"+(totalCount!==1?"s":"")}
            </div>
            {nUpcomingUnset > 0 && (
              <div style={{ fontSize:10, color:"#b45309", marginTop:2 }}>
                {"\u26A0 "} {nUpcomingUnset} upcoming event{nUpcomingUnset!==1?"s":""} have no placement selected {"\u2014"} those slots are still enumerated below
              </div>
            )}
          </div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"flex-end" }}>
            <div>
              <div style={{ fontSize:10, color:"var(--text-muted)", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.06em" }}>Excl. Reg better than</div>
              <select value={regCapCp??""} onChange={e=>setRegCapCp(e.target.value===""?null:Number(e.target.value))} style={selStyle}>
                <option value="">None</option>
                {REG_PLACEMENTS.slice(0,-1).map(p=><option key={p.label} value={p.cp}>{p.label} ({p.cp} CP)</option>)}
              </select>
            </div>
            <div>
              <div style={{ fontSize:10, color:"var(--text-muted)", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.06em" }}>Excl. IC better than</div>
              <select value={icCapCp??""} onChange={e=>setIcCapCp(e.target.value===""?null:Number(e.target.value))} style={selStyle}>
                <option value="">None</option>
                {IC_PLACEMENTS.slice(0,-1).map(p=><option key={p.label} value={p.cp}>{p.label} ({p.cp} CP)</option>)}
              </select>
            </div>
            <div>
              <div style={{ fontSize:10, color:"var(--text-muted)", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.06em" }}>Min CP</div>
              <select value={minTotal} onChange={e=>setMinTotal(Number(e.target.value))} style={selStyle}>
                {MIN_CP_OPTIONS.map(v=><option key={v} value={v}>{v}</option>)}
              </select>
            </div>
            <div>
              <div style={{ fontSize:10, color:"var(--text-muted)", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.06em" }}>Sort</div>
              <select value={sortDir} onChange={e=>setSortDir(e.target.value)} style={selStyle}>
                <option value="desc">High {"\u2192"} Low</option>
                <option value="asc">Low {"\u2192"} High</option>
              </select>
            </div>
            <div>
              <div style={{ fontSize:10, color:"var(--text-muted)", marginBottom:3, textTransform:"uppercase", letterSpacing:"0.06em" }}>Export</div>
              <div style={{ display:"flex", gap:4 }}>
                <button onClick={copyToClipboard} style={{ background:copyStatus?"rgba(34,197,94,0.14)":"var(--add-btn-bg)", border:`1px solid ${copyStatus?"rgba(34,197,94,0.35)":"var(--card-border)"}`, borderRadius:6, padding:"5px 10px", cursor:"pointer", color:copyStatus?"var(--thresh-800)":"var(--text-sub)", fontSize:11, outline:"none", minWidth:72, textAlign:"center", transition:"all 0.18s" }}>
                  {copyStatus||"\uD83D\uDCCB Copy"}
                </button>
                <button onClick={downloadCSV} style={{ background:"var(--add-btn-bg)", border:"1px solid var(--card-border)", borderRadius:6, padding:"5px 10px", cursor:"pointer", color:"var(--text-sub)", fontSize:11, outline:"none" }}>{"\u2B07"} CSV</button>
              </div>
            </div>
          </div>
        </div>
        <div style={{ display:"flex", gap:10, marginTop:8, flexWrap:"wrap", alignItems:"center" }}>
          {THRESHOLDS.map(t=>(
            <div key={t} style={{ display:"flex", alignItems:"center", gap:4, fontSize:10 }}>
              <div style={{ width:8, height:8, borderRadius:2, background:THRESH_COLORS[t] }} />
              <span style={{ color:"var(--text-muted)" }}>{t}+</span>
            </div>
          ))}
          <div style={{ width:1, height:12, background:"var(--divider-color)" }} />
          <div style={{ display:"flex", alignItems:"center", gap:4, fontSize:10 }}>
            <div style={{ width:8, height:8, borderRadius:2, background:"var(--chip-played-bg)", border:"1px solid var(--chip-played-border)" }} />
            <span style={{ color:"var(--text-muted)" }}>Played (fixed)</span>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:4, fontSize:10 }}>
            <div style={{ width:8, height:8, borderRadius:2, background:"var(--chip-reg-bg)", border:"1px solid var(--chip-reg-border)" }} />
            <span style={{ color:"var(--text-muted)" }}>Upcoming Reg</span>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:4, fontSize:10 }}>
            <div style={{ width:8, height:8, borderRadius:2, background:"var(--chip-ic-bg)", border:"1px solid var(--chip-ic-border)" }} />
            <span style={{ color:"var(--text-muted)" }}>Upcoming IC</span>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:4, fontSize:10 }}>
            <div style={{ width:8, height:8, borderRadius:2, background:"var(--chip-dash-bg)", border:"1px solid var(--chip-dash-border)" }} />
            <span style={{ color:"var(--text-muted)" }}>{"\u2014"} (0 pts or outside top {TOP_N})</span>
          </div>
        </div>
      </div>

      <div className="table-scroll-wrap">
        <table className="combo-table" style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
          <thead>
            <tr style={{ borderBottom:"1px solid var(--table-head-border)" }}>
              {playedRegData.map((_,i)=>(
                <th key={`prh${i}`} style={{...th, background:"var(--th-played-bg)"}}>Played Reg {i+1}</th>
              ))}
              {playedICData.map((_,i)=>(
                <th key={`pich${i}`} style={{...th, background:"var(--th-played-bg)", borderRight:i===playedICData.length-1?"2px solid var(--table-divider)":undefined}}>Played IC {i+1}</th>
              ))}
              {playedRegData.length>0 && playedICData.length===0 && nUpcoming>0 && (
                <th style={{...th, padding:0, width:0, borderRight:"2px solid var(--table-divider)"}} />
              )}
              {Array.from({length:nUpcomingReg},(_,i)=>(
                <th key={`urh${i}`} style={{...th, color:"var(--th-upcoming-reg)"}}>Upcoming Reg {i+1}</th>
              ))}
              {Array.from({length:nUpcomingIC},(_,i)=>(
                <th key={`uich${i}`} style={{...th, color:"var(--th-upcoming-ic)"}}>Upcoming IC {i+1}</th>
              ))}
              <th style={th}>Top-{TOP_N} Sum</th>
              <th style={th}>Total CP</th>
            </tr>
          </thead>
          <tbody>
            {combos.map((row,i)=>{
              const rowColor = getThresholdColor(row.total);
              const rowBg    = getThresholdBg(row.total);
              return (
                <tr key={i} style={{ borderBottom:"1px solid var(--table-row-border)", background:rowBg||"transparent" }}>
                  {playedRegData.map((p,j)=>(
                    <td key={`pr${j}`} style={{...td, background:"var(--table-dark-bg)"}}>
                      <Chip label={p.label} cp={p.cp} variant="played-reg" />
                    </td>
                  ))}
                  {playedICData.map((p,j)=>(
                    <td key={`pic${j}`} style={{...td, background:"var(--table-dark-bg)", borderRight:j===playedICData.length-1?"2px solid var(--table-divider)":undefined}}>
                      <Chip label={p.label} cp={p.cp} variant="played-ic" />
                    </td>
                  ))}
                  {playedRegData.length>0 && playedICData.length===0 && nUpcoming>0 && (
                    <td style={{padding:0, width:0, borderRight:"2px solid var(--table-divider)"}} />
                  )}
                  {row.regC.map(({cp,show},j)=>(
                    <td key={`ur${j}`} style={td}>{show ? <Chip label={cpToLabel("reg",cp)} cp={cp} variant="upcoming-reg" /> : <DashChip />}</td>
                  ))}
                  {row.icC.map(({cp,show},j)=>(
                    <td key={`uic${j}`} style={td}>{show ? <Chip label={cpToLabel("ic",cp)} cp={cp} variant="upcoming-ic" /> : <DashChip />}</td>
                  ))}
                  <td style={{...td, fontFamily:"'IBM Plex Mono', monospace", color:"var(--text-top5sum)", fontSize:11, fontWeight:500}}>{row.mSum}</td>
                  <td style={td}>
                    <span style={{ fontFamily:"'IBM Plex Mono', monospace", fontWeight:700, fontSize:13, color:rowColor||"var(--total-cp-unmet)", background:rowBg?rowColor+"18":"var(--btn-inactive-bg)", border:`1px solid ${rowColor?rowColor+"30":"var(--card-border)"}`, borderRadius:5, padding:"2px 9px" }}>
                      {row.total}
                    </span>
                  </td>
                </tr>
              );
            })}
            {combos.length===0 && (
              <tr>
                <td colSpan={playedRegData.length+playedICData.length+nUpcomingReg+nUpcomingIC+2} style={{ padding:28, textAlign:"center", color:"var(--no-data-color)" }}>
                  No combinations meet the current filters.
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>

      {totalCount > MAX_DISPLAY && (
        <div style={{ marginTop:8, fontSize:11, color:"var(--text-muted)", textAlign:"center" }}>
          Showing top {MAX_DISPLAY} of {totalCount.toLocaleString()} {"\u2014"} raise Min CP or add exclusions to narrow results
        </div>
      )}
    </div>
  );
}

  </script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
